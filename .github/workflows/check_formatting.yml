name: check_formatting

on:
    workflow_call:

jobs:
    check_formatting:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup node
              uses: actions/setup-node@v6
              with:
                  node-version: latest

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check
